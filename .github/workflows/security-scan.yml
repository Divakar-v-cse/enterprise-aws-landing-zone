name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: Checkov (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install --upgrade pip checkov==3.4.5
      - name: Run Checkov
        run: |
          mkdir -p security/raw
          checkov -d . --framework terraform \
            --config-file policies/scanners/checkov.yaml \
            --output json --output-file-path security/raw --compact --quiet
      - name: Upload Checkov JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: security/raw/

  trivy:
    name: Trivy (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Trivy CLI is installed directly instead of using a wrapper action:
      # the wrapper tag pinned here previously could not be resolved by GitHub,
      # which failed the job before any scan ran. A pinned release tarball is
      # deterministic and has no action-resolution dependency.
      - name: Install Trivy 0.76.2
        run: |
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy config scan
        run: |
          trivy config . \
            --config policies/scanners/trivy.yaml \
            --ignorefile .trivyignore.yaml \
            --severity CRITICAL,HIGH,MEDIUM \
            --format table
          trivy config . \
            --config policies/scanners/trivy.yaml \
            --ignorefile .trivyignore.yaml \
            --format sarif --output trivy-results.sarif

      - name: Upload Trivy SARIF artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30
          if-no-files-found: warn

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository secret scan (defence in depth)
        run: python scripts/secret_scan.py --format json --output security/raw/secret-scan.json

  policy-lint:
    name: IAM policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/policy_lint.py --json security/raw/policy-lint.json
      - name: Upload policy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-lint
          path: security/raw/
