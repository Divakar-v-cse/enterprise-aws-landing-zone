name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: Checkov (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install --upgrade pip checkov==3.4.5
      - name: Run Checkov
        run: |
          mkdir -p security/raw
          checkov -d . --framework terraform \
            --config-file policies/scanners/checkov.yaml \
            --output json --output-file-path security/raw --compact --quiet
      - name: Upload Checkov JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: security/raw/

  trivy:
    name: Trivy (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository secret scan (defence in depth)
        run: python scripts/secret_scan.py --format json --output security/raw/secret-scan.json

  policy-lint:
    name: IAM policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/policy_lint.py --json security/raw/policy-lint.json
      - name: Upload policy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-lint
          path: security/raw/
