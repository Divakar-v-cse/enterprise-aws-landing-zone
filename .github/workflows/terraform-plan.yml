name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        default: dev
        type: choice
        options: [dev, staging, production]
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - "**.tf"

permissions:
  contents: read
  id-token: write      # required for GitHub OIDC -> AWS
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.inputs.environment || 'pr' }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # OIDC is only used when the repository variable AWS_ROLE_TO_ASSUME is set.
      # No long-lived AWS access keys are ever stored in this repository.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-plan-${{ env.ENVIRONMENT }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init -input=false -no-color \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=landing-zone/$ENVIRONMENT/terraform.tfstate" \
              -backend-config="region=$AWS_REGION"
          else
            echo "::notice::No remote state configured - using the local backend (validation only)."
            terraform init -input=false -no-color
          fi

      - name: terraform plan
        run: terraform plan -input=false -no-color -out=plan.tfplan

      - name: Plan summary
        run: |
          terraform show -no-color plan.tfplan > plan.txt
          tail -n 60 plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Cost estimate (indicative)
        working-directory: .
        run: |
          terraform -chdir=environments/$ENVIRONMENT show -json environments/$ENVIRONMENT/plan.tfplan > plan.json
          python scripts/cost_guard.py --plan plan.json --no-fail

      - name: Upload plan artefact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: |
            environments/${{ env.ENVIRONMENT }}/plan.tfplan
            environments/${{ env.ENVIRONMENT }}/plan.txt
          retention-days: 14
