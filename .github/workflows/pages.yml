# Publish the read-only project console to GitHub Pages.
#
# The site is static and rebuilt from sanitised artefacts committed with it
# (frontend/summary.json), so no AWS credentials or network access are needed.
name: Publish project console

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_frontend.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Rebuild index.html from committed summary
        run: python scripts/build_frontend.py

      - name: Fail if the build produced no page
        run: |
          test -s frontend/index.html || { echo "::error::frontend/index.html missing"; exit 1; }
          grep -q "Enterprise AWS Landing Zone" frontend/index.html || { echo "::error::unexpected page content"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
